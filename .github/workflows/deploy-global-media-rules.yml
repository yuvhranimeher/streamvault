name: Deploy StreamVault detail fast path

on:
  push:
    branches:
      - hostinger-frontend-only
    paths:
      - .github/workflows/deploy-global-media-rules.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hostinger-frontend-only
          persist-credentials: true
          fetch-depth: 0

      - name: Enable instant lightweight media details
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('hostinger/index.html')
          s = p.read_text(encoding='utf-8-sig')
          tag = '<script defer src="/detail-fast-path-v1.js?v=20260818-detail-fast-v1"></script>'
          if tag not in s:
              anchor = '<script src="/software-download-title-ui-v1.js?v=20260813-software-title-ui-v1"></script>'
              if anchor in s:
                  s = s.replace(anchor, tag + '\n' + anchor, 1)
              else:
                  s = s.replace('</body>', tag + '\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate fast path
        shell: bash
        run: |
          node --check hostinger/detail-fast-path-v1.js

      - name: Commit production detail optimization
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hostinger/index.html
          if git diff --cached --quiet; then
            echo "Fast path already enabled"
            exit 0
          fi
          git commit -m "Enable instant lightweight media details"
          git push origin HEAD:hostinger-frontend-only
