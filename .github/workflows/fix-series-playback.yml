name: Fix series playback recovery

on:
  push:
    branches:
      - hostinger-frontend-only
    paths:
      - .github/workflows/fix-series-playback.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hostinger-frontend-only
          persist-credentials: true
          fetch-depth: 2
      - name: Apply series detail fix
        run: python3 .github/scripts/patch-series-hydration.py
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hostinger/app-v3.js
          if git diff --cached --quiet; then
            echo "Series recovery patch already present"
            exit 0
          fi
          git commit -m "Hydrate series episodes in detail modal"
          git pull --rebase origin hostinger-frontend-only
          git push origin HEAD:hostinger-frontend-only
