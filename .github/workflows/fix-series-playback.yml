name: Fix global series episode hydration

on:
  push:
    branches:
      - hostinger-frontend-only
    paths:
      - .github/workflows/fix-series-playback.yml
      - .github/scripts/patch-series-hydration.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hostinger-frontend-only
          persist-credentials: true
          fetch-depth: 2
      - name: Apply global series episode fix
        run: python3 .github/scripts/patch-series-hydration.py
      - name: Verify frontend JavaScript syntax
        run: node --check hostinger/app-v3.js
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hostinger/app-v3.js
          if git diff --cached --quiet; then
            echo "Global series episode fix already present and syntax-valid"
            exit 0
          fi
          git commit -m "Fix episode lists for all series details"
          git pull --rebase origin hostinger-frontend-only
          git push origin HEAD:hostinger-frontend-only
