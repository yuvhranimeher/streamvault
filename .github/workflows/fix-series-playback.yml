name: Fix StreamVault frontend patches

on:
  push:
    branches:
      - hostinger-frontend-only
    paths:
      - .github/workflows/fix-series-playback.yml
      - .github/scripts/patch-series-hydration.py
      - .github/scripts/patch-search-full-catalog.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hostinger-frontend-only
          persist-credentials: true
          fetch-depth: 2
      - name: Apply series fix
        run: python3 .github/scripts/patch-series-hydration.py
      - name: Apply search fix
        run: python3 .github/scripts/patch-search-full-catalog.py
      - name: Verify JavaScript
        run: |
          node --check hostinger/app-v3.js
          node --check hostinger/search.js
          node --check hostinger/search-full-catalog-v2.js
      - name: Commit frontend files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hostinger/app-v3.js hostinger/search.js hostinger/index.html
          if git diff --cached --quiet; then
            echo "Frontend patches already applied"
            exit 0
          fi
          git commit -m "Fix complete CircleFTP catalog search"
          git pull --rebase origin hostinger-frontend-only
          git push origin HEAD:hostinger-frontend-only
