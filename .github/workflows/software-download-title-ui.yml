name: Software download title UI

on:
  push:
    branches:
      - hostinger-frontend-only
    paths:
      - .github/workflows/software-download-title-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: hostinger-frontend-only
          persist-credentials: true

      - name: Patch software downloads only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('hostinger/downloads.js')
          text = path.read_text(encoding='utf-8-sig')
          marker = 'SV_SOFTWARE_TITLE_UI_V1'
          if marker in text:
              print('Software title UI already installed')
              raise SystemExit(0)

          old_state = """    legacyItems: []\n  };"""
          new_state = """    legacyItems: [],\n    softwareGroups: [],\n    softwareFiltered: [],\n    softwareGroupMap: new Map(),\n    softwareArtworkCache: new Map(),\n    softwareArtworkPending: new Map()\n  };"""
          if old_state not in text:
              raise SystemExit('state marker not found')
          text = text.replace(old_state, new_state, 1)

          insert_at = "  function updateCount(){"
          if insert_at not in text:
              raise SystemExit('updateCount marker not found')

          helpers = r'''
  /* SV_SOFTWARE_TITLE_UI_V1 — isolated to Files & Downloads > Software & Games */
  const softwarePosterQueue=[];
  let softwarePosterActive=0;
  let softwareArtworkStorageLoaded=false;

  function isSoftwareTitleView(){
    return state.mode === 'catalog' && state.categoryMeta?.category === 'software_games';
  }

  function softwareDecode(value){
    try{return decodeURIComponent(String(value || ''));}catch{return String(value || '');}
  }

  function softwarePathParts(item){
    try{
      const url=new URL(String(item?.url || ''),location.href);
      return softwareDecode(url.pathname).split('/').filter(Boolean);
    }catch{
      return softwareDecode(item?.url || '').split(/[\\/]/).filter(Boolean);
    }
  }

  function softwareParentFolder(item){
    const parts=softwarePathParts(item);
    return parts.length > 1 ? parts[parts.length-2] : '';
  }

  function softwareTitleFromItem(item){
    const generic=/^(?:file|pc game backup|consoles? game|games?\s*-\s*pc(?:\s*\d+)?|pc, consoles games & mods)$/i;
    let raw=softwareParentFolder(item);
    if(!raw || generic.test(raw))raw=String(item?.name || item?.filename || 'Untitled');
    raw=softwareDecode(raw)
      .replace(/\.(?:rar|zip|7z|iso|exe|appx|appxbundle|nsp|nsz|xci|3ds|cso|pkg|dmg|ipa|xap)(?:\?.*)?$/i,' ')
      .replace(/\.part\s*0*\d+$/i,' ')
      .replace(/\bpart\s*0*\d+\b/ig,' ')
      .replace(/\s*[\[(][^\])]*(?:backup|repack|portable|setup|steam|epic|gog|origin|official|dodi|fitgirl|ps[1-5]|xbox|switch|nintendo)[^\])]*[\])]/ig,' ')
      .replace(/\s*[\[(]\s*(?:19|20)\d{2}[^\])]*[\])]/g,' ')
      .replace(/\s+(?:steam|epic|gog|origin|official)\s+backup.*$/i,' ')
      .replace(/\s+/g,' ')
      .replace(/^[\s._-]+|[\s._-]+$/g,'');
    return raw || String(item?.name || 'Untitled');
  }

  function softwareTitleKey(value){
    return String(value || '')
      .normalize?.('NFKD')
      ?.replace(/[\u0300-\u036f]/g,'')
      .toLowerCase()
      .replace(/&/g,' and ')
      .replace(/[^a-z0-9]+/g,'-')
      .replace(/^-+|-+$/g,'') || String(value || '').toLowerCase().replace(/[^a-z0-9]+/g,'-');
  }

  function softwarePlatform(item){
    const text=softwareDecode(`${item?.url || ''} ${softwareParentFolder(item)} ${item?.name || ''}`).toLowerCase();
    if(/\bps5\b/.test(text))return 'PS5';
    if(/\bps4\b/.test(text))return 'PS4';
    if(/\bps3\b/.test(text))return 'PS3';
    if(/\bps2\b/.test(text))return 'PS2';
    if(/\bxbox\b/.test(text))return 'Xbox';
    if(/\bnintendo\b|\bswitch\b/.test(text))return 'Nintendo';
    if(/pc game|steam|epic|gog|origin|windows|\.exe\b|\.appx\b/.test(text))return 'PC';
    return 'Software';
  }

  function softwareGroupSearchText(group){
    return [
      group.title,
      ...(group.platforms || []),
      ...(group.hosts || []),
      ...(group.extensions || []),
      ...(group.files || []).map(file=>file.name || file.filename || '')
    ].join(' ').toLowerCase();
  }

  function rebuildSoftwareGroups(){
    if(!isSoftwareTitleView())return;
    const map=new Map();
    for(const item of state.items){
      const title=softwareTitleFromItem(item);
      const key=softwareTitleKey(title) || `software-${map.size}`;
      let group=map.get(key);
      if(!group){
        group={key,title,files:[],platformSet:new Set(),hostSet:new Set(),extensionSet:new Set(),folderSet:new Set()};
        map.set(key,group);
      }
      group.files.push(item);
      group.platformSet.add(softwarePlatform(item));
      if(item.host)group.hostSet.add(String(item.host));
      if(item.extension)group.extensionSet.add(String(item.extension).replace(/^\./,'').toUpperCase());
      const folder=softwareParentFolder(item);
      if(folder)group.folderSet.add(folder);
    }
    state.softwareGroups=[...map.values()].map(group=>({
      key:group.key,
      title:group.title,
      files:group.files.sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),undefined,{numeric:true,sensitivity:'base'})),
      platforms:[...group.platformSet].sort(),
      hosts:[...group.hostSet].sort(),
      extensions:[...group.extensionSet].sort(),
      folders:[...group.folderSet].sort()
    })).sort((a,b)=>a.title.localeCompare(b.title,undefined,{numeric:true,sensitivity:'base'}));
    state.softwareGroupMap=new Map(state.softwareGroups.map(group=>[group.key,group]));
  }

  function softwareInitials(title){
    const words=String(title || '').trim().split(/\s+/).filter(Boolean);
    return (words.slice(0,2).map(word=>word[0]?.toUpperCase() || '').join('') || 'SV').slice(0,2);
  }

  function loadSoftwareArtworkStorage(){
    if(softwareArtworkStorageLoaded)return;
    softwareArtworkStorageLoaded=true;
    try{
      const raw=JSON.parse(localStorage.getItem('sv_software_artwork_v1') || '{}');
      Object.entries(raw).forEach(([key,value])=>state.softwareArtworkCache.set(key,value));
    }catch{}
  }

  function persistSoftwareArtworkStorage(){
    try{
      const entries=[...state.softwareArtworkCache.entries()].slice(-600);
      localStorage.setItem('sv_software_artwork_v1',JSON.stringify(Object.fromEntries(entries)));
    }catch{}
  }

  function softwareMatchScore(query,candidate){
    const q=softwareTitleKey(query).replace(/-/g,' ');
    const c=softwareTitleKey(candidate).replace(/-/g,' ');
    if(!q || !c)return 0;
    if(q===c)return 1000;
    if(c.startsWith(q) || q.startsWith(c))return 850;
    if(c.includes(q) || q.includes(c))return 760;
    const qs=new Set(q.split(/\s+/).filter(Boolean));
    const cs=new Set(c.split(/\s+/).filter(Boolean));
    let hit=0;
    qs.forEach(token=>{if(cs.has(token))hit++;});
    return qs.size ? Math.round((hit/qs.size)*600) : 0;
  }

  async function lookupSoftwareArtwork(group){
    loadSoftwareArtworkStorage();
    if(state.softwareArtworkCache.has(group.key))return state.softwareArtworkCache.get(group.key);
    if(state.softwareArtworkPending.has(group.key))return state.softwareArtworkPending.get(group.key);
    const promise=(async()=>{
      try{
        const endpoint=`https://store.steampowered.com/api/storesearch/?term=${encodeURIComponent(group.title)}&l=english&cc=US`;
        const response=await fetch(endpoint,{cache:'force-cache',credentials:'omit',mode:'cors'});
        if(!response.ok)throw new Error(`artwork HTTP ${response.status}`);
        const payload=await response.json();
        const rows=Array.isArray(payload?.items)?payload.items:[];
        let best=null,bestScore=0;
        rows.slice(0,10).forEach(item=>{
          const score=softwareMatchScore(group.title,item?.name || '');
          if(score>bestScore){best=item;bestScore=score;}
        });
        const result=best && bestScore>=500 ? {
          appid:String(best.id || ''),
          matchedName:String(best.name || ''),
          tiny:String(best.tiny_image || '')
        } : null;
        state.softwareArtworkCache.set(group.key,result);
        persistSoftwareArtworkStorage();
        return result;
      }catch(error){
        console.debug?.('[Software artwork] lookup unavailable',group.title,error?.message || error);
        return null;
      }finally{
        state.softwareArtworkPending.delete(group.key);
      }
    })();
    state.softwareArtworkPending.set(group.key,promise);
    return promise;
  }

  function softwarePosterHd(appid){
    return appid ? `https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/${encodeURIComponent(appid)}/library_600x900_2x.jpg` : '';
  }
  function softwarePosterStandard(appid){
    return appid ? `https://shared.fastly.steamstatic.com/store_item_assets/steam/apps/${encodeURIComponent(appid)}/library_600x900.jpg` : '';
  }

  function softwarePosterMarkup(group,extraClass=''){
    return `<div class="sv-software-poster ${dEsc(extraClass)}" data-software-poster="${dEsc(group.key)}">
      <div class="sv-software-poster-fallback"><span>${dEsc(softwareInitials(group.title))}</span><small>${dEsc(group.title)}</small></div>
      <img class="sv-software-poster-img" alt="${dEsc(group.title)} poster" loading="lazy" decoding="async" referrerpolicy="no-referrer" hidden>
    </div>`;
  }

  function queueSoftwarePoster(node,group){
    if(!node || node.dataset.artworkQueued==='1')return;
    node.dataset.artworkQueued='1';
    softwarePosterQueue.push({node,group});
    pumpSoftwarePosterQueue();
  }

  function pumpSoftwarePosterQueue(){
    while(softwarePosterActive<4 && softwarePosterQueue.length){
      const task=softwarePosterQueue.shift();
      softwarePosterActive++;
      lookupSoftwareArtwork(task.group).then(meta=>{
        if(!meta?.appid || !task.node?.isConnected)return;
        const img=task.node.querySelector('.sv-software-poster-img');
        if(!img)return;
        img.dataset.appid=meta.appid;
        img.dataset.tiny=meta.tiny || '';
        img.dataset.stage='0';
        img.src=softwarePosterHd(meta.appid);
        img.hidden=false;
        task.node.classList.add('has-artwork');
      }).finally(()=>{
        softwarePosterActive--;
        pumpSoftwarePosterQueue();
      });
    }
  }

  function hydrateSoftwarePosters(root=document){
    if(!isSoftwareTitleView())return;
    root.querySelectorAll?.('[data-software-key]').forEach(card=>{
      const group=state.softwareGroupMap.get(card.dataset.softwareKey || '');
      const poster=card.querySelector?.('[data-software-poster]');
      if(group && poster)queueSoftwarePoster(poster,group);
    });
  }

  function softwareTitleCardHtml(group){
    const fileCount=group.files.length;
    const platform=(group.platforms || []).join(' · ') || 'Software';
    return `<button class="sv-software-title-card" type="button" data-software-key="${dEsc(group.key)}" aria-label="Open ${dEsc(group.title)} details">
      ${softwarePosterMarkup(group)}
      <span class="sv-software-title-name">${dEsc(group.title)}</span>
      <span class="sv-software-title-meta">${dEsc(platform)}</span>
      <span class="sv-software-title-count">${fileCount.toLocaleString()} file${fileCount===1?'':'s'}</span>
    </button>`;
  }

  function installSoftwareDownloadStyles(){
    if(document.getElementById('svSoftwareTitleUiStyles'))return;
    const style=document.createElement('style');
    style.id='svSoftwareTitleUiStyles';
    style.textContent=`
      #downloadsGrid.sv-software-title-grid{display:grid!important;grid-template-columns:repeat(auto-fill,minmax(112px,142px))!important;gap:16px!important;align-items:start!important;justify-content:start!important}
      .sv-software-title-card{appearance:none;border:1px solid rgba(255,255,255,.12);background:#101012;color:#fff;border-radius:12px;overflow:hidden;padding:0;text-align:left;cursor:pointer;min-width:0;transition:transform .18s ease,border-color .18s ease,background .18s ease;box-shadow:none}
      .sv-software-title-card:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.3);background:#151518}
      .sv-software-poster{position:relative;width:100%;aspect-ratio:2/3;background:linear-gradient(145deg,#1d2028,#090a0d);overflow:hidden}
      .sv-software-poster-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
      .sv-software-poster-fallback{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px;text-align:center;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.11),transparent 35%),linear-gradient(145deg,#1b1d23,#08090c)}
      .sv-software-poster-fallback span{font-size:30px;font-weight:900;letter-spacing:-1px}
      .sv-software-poster-fallback small{font-size:9px;line-height:1.2;color:rgba(255,255,255,.62);max-height:34px;overflow:hidden}
      .sv-software-title-name{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12px;font-weight:800;line-height:1.25;padding:10px 10px 0;min-height:40px}
      .sv-software-title-meta{display:block;font-size:9px;color:rgba(255,255,255,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:6px 10px 0}
      .sv-software-title-count{display:block;font-size:9px;font-weight:800;color:#fff;padding:7px 10px 11px}
      .sv-software-modal{position:fixed;inset:0;z-index:20000;display:flex;align-items:center;justify-content:center;padding:22px;background:rgba(0,0,0,.76);backdrop-filter:blur(8px)}
      .sv-software-modal[aria-hidden="true"]{display:none}
      .sv-software-modal-panel{position:relative;width:min(760px,94vw);max-height:84vh;overflow:hidden;border:1px solid rgba(255,255,255,.14);border-radius:18px;background:#0d0d0f;box-shadow:0 30px 100px rgba(0,0,0,.65)}
      .sv-software-modal-close{position:absolute;right:14px;top:14px;z-index:2;width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.72);color:#fff;font-size:24px;line-height:1;cursor:pointer}
      .sv-software-modal-body{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;padding:22px;max-height:84vh;overflow:auto}
      .sv-software-modal .sv-software-poster{border-radius:10px;border:1px solid rgba(255,255,255,.12);align-self:start}
      .sv-software-modal-title{font-size:23px;font-weight:900;line-height:1.1;padding-right:40px;margin:2px 0 8px}
      .sv-software-modal-summary{font-size:12px;color:rgba(255,255,255,.58);line-height:1.55;margin-bottom:12px}
      .sv-software-badges{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
      .sv-software-badge{border:1px solid rgba(255,255,255,.13);background:#151518;border-radius:999px;padding:5px 8px;font-size:9px;font-weight:800;color:rgba(255,255,255,.78)}
      .sv-software-file-heading{font-size:13px;font-weight:900;margin:0 0 8px}
      .sv-software-file-list{display:flex;flex-direction:column;gap:7px;max-height:360px;overflow:auto;padding-right:4px}
      .sv-software-file-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:9px 10px;background:#111114}
      .sv-software-file-name{font-size:10px;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
      .sv-software-file-meta{font-size:8px;color:rgba(255,255,255,.45);margin-top:3px}
      .sv-software-file-download{display:inline-flex;align-items:center;justify-content:center;min-width:74px;height:31px;border-radius:999px;background:#fff;color:#050505!important;text-decoration:none!important;font-size:9px;font-weight:900;padding:0 12px}
      @media(max-width:640px){#downloadsGrid.sv-software-title-grid{grid-template-columns:repeat(auto-fill,minmax(102px,1fr))!important;gap:11px!important}.sv-software-modal{padding:10px}.sv-software-modal-body{grid-template-columns:92px minmax(0,1fr);gap:12px;padding:16px}.sv-software-modal-title{font-size:18px}.sv-software-file-row{grid-template-columns:1fr}.sv-software-file-download{width:100%}}
    `;
    document.head.appendChild(style);
  }

  function ensureSoftwareModal(){
    let modal=document.getElementById('svSoftwareDownloadModal');
    if(modal)return modal;
    modal=document.createElement('div');
    modal.id='svSoftwareDownloadModal';
    modal.className='sv-software-modal';
    modal.setAttribute('aria-hidden','true');
    modal.innerHTML='<div class="sv-software-modal-panel" role="dialog" aria-modal="true" aria-labelledby="svSoftwareModalTitle"><button class="sv-software-modal-close" type="button" aria-label="Close">×</button><div class="sv-software-modal-body"></div></div>';
    document.body.appendChild(modal);
    modal.addEventListener('click',event=>{
      if(event.target===modal || event.target.closest('.sv-software-modal-close'))closeSoftwareModal();
    });
    return modal;
  }

  function closeSoftwareModal(){
    const modal=document.getElementById('svSoftwareDownloadModal');
    if(!modal)return;
    modal.setAttribute('aria-hidden','true');
  }

  function softwareFileRowHtml(file,index){
    const href=safeHttpUrl(file.url) || '#';
    const ext=String(file.extension || '').replace(/^\./,'').toUpperCase();
    const meta=[ext,file.host].filter(Boolean).join(' · ');
    return `<div class="sv-software-file-row">
      <div><div class="sv-software-file-name">${dEsc(file.name || file.filename || `File ${index+1}`)}</div><div class="sv-software-file-meta">${dEsc(meta)}</div></div>
      <a class="sv-software-file-download" href="${dEsc(href)}" target="_blank" rel="noopener noreferrer">Download</a>
    </div>`;
  }

  function openSoftwareModal(key){
    const group=state.softwareGroupMap.get(String(key || ''));
    if(!group)return;
    installSoftwareDownloadStyles();
    const modal=ensureSoftwareModal();
    const body=modal.querySelector('.sv-software-modal-body');
    const platforms=(group.platforms || []).join(', ') || 'Software';
    const hosts=(group.hosts || []).join(', ') || 'External source';
    const types=(group.extensions || []).join(', ') || 'Files';
    body.innerHTML=`
      <div>${softwarePosterMarkup(group,'sv-software-modal-poster')}</div>
      <div>
        <h2 id="svSoftwareModalTitle" class="sv-software-modal-title">${dEsc(group.title)}</h2>
        <div class="sv-software-modal-summary">${group.files.length.toLocaleString()} downloadable file${group.files.length===1?'':'s'} · ${dEsc(platforms)}<br>Sources: ${dEsc(hosts)}</div>
        <div class="sv-software-badges">${(group.platforms || []).map(value=>`<span class="sv-software-badge">${dEsc(value)}</span>`).join('')} ${(group.extensions || []).map(value=>`<span class="sv-software-badge">${dEsc(value)}</span>`).join('')}</div>
        <div class="sv-software-file-heading">Available files (${group.files.length.toLocaleString()})</div>
        <div class="sv-software-file-list">${group.files.map(softwareFileRowHtml).join('')}</div>
      </div>`;
    modal.setAttribute('aria-hidden','false');
    const poster=body.querySelector('[data-software-poster]');
    if(poster)queueSoftwarePoster(poster,group);
  }

  async function loadAllSoftwarePages(){
    if(!isSoftwareTitleView() || state.allPagesLoaded || !state.categoryMeta)return;
    state.searching=true;
    renderDownloads();
    const pages=Number(state.categoryMeta.pages || 0);
    try{
      const pending=[];
      for(let page=1;page<=pages;page++)if(!state.loadedPages.has(page))pending.push(page);
      for(let i=0;i<pending.length;i+=4){
        await Promise.all(pending.slice(i,i+4).map(page=>loadCatalogPage(page,false)));
      }
    }catch(error){
      state.error=`Could not load software titles: ${error?.message || error}`;
    }finally{
      state.searching=false;
      rebuildSoftwareGroups();
      renderDownloads();
    }
  }

  installSoftwareDownloadStyles();
  document.addEventListener('click',event=>{
    const card=event.target.closest?.('.sv-software-title-card[data-software-key]');
    if(card){event.preventDefault();openSoftwareModal(card.dataset.softwareKey);}
  });
  document.addEventListener('keydown',event=>{
    if(event.key==='Escape')closeSoftwareModal();
  });
  document.addEventListener('error',event=>{
    const img=event.target;
    if(!(img instanceof HTMLImageElement) || !img.classList.contains('sv-software-poster-img'))return;
    const stage=Number(img.dataset.stage || '0');
    const appid=img.dataset.appid || '';
    if(stage===0 && appid){img.dataset.stage='1';img.src=softwarePosterStandard(appid);return;}
    if(stage<=1 && img.dataset.tiny){img.dataset.stage='2';img.src=img.dataset.tiny;return;}
    img.hidden=true;
    img.closest('.sv-software-poster')?.classList.remove('has-artwork');
  },true);

'''
