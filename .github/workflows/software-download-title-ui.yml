name: Software download title UI

on:
  push:
    branches:
      - hostinger-frontend-only
    paths:
      - .github/workflows/software-download-title-ui.yml

permissions:
  contents: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: hostinger-frontend-only
          persist-credentials: true

      - name: Add software UI script to frontend
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('hostinger/index.html')
          text = path.read_text(encoding='utf-8-sig')
          tag = '<script src="/software-download-title-ui-v1.js?v=20260813-software-title-ui-v1"></script>'
          if tag not in text:
              if '</body>' not in text:
                  raise SystemExit('closing body tag not found')
              text = text.replace('</body>', tag + '\n</body>', 1)
              path.write_text(text, encoding='utf-8')
              print('Added software title UI script tag')
          else:
              print('Software title UI script tag already present')
          PY

      - name: Verify frontend files
        shell: bash
        run: |
          set -euo pipefail
          test -f hostinger/software-download-title-ui-v1.js
          grep -q 'software-download-title-ui-v1.js' hostinger/index.html
          node --check hostinger/software-download-title-ui-v1.js

      - name: Commit frontend loader
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hostinger/index.html
          if git diff --cached --quiet; then
            echo "Loader already installed"
            exit 0
          fi
          git commit -m "Enable isolated software download title UI"
          git push origin HEAD:hostinger-frontend-only
